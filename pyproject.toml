[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdh"
version = "0.1.1"
description = "Minimal Markdown-to-HTML converter CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Solo Dev", email = "solo@example.com" }]

[project.scripts]
mdh = "mdh.cli:main"
